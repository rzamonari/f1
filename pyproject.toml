[project]
name = "f1"
version = "0.1.0"
description = "Pipeline de dados históricos de Fórmula 1 a partir da API OpenF1, com carga em DuckDB."
authors = [
    {name = "Ricardo Zamonari",email = "rzamonari@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "duckdb (>=1.5.6,<2.0.0)",
    "streamlit (>=1.65.0,<2.0.0)"
]

[project.scripts]
f1 = "f1.cli:main"

[tool.poetry]
requires-poetry = ">=2.1,<3.0"
packages = [{include = "f1", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# "site" é a saída gerada pelo `mkdocs build` e não contém código-fonte.
extend-exclude = ["site"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle (erros)
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes: nomes indefinidos, imports não usados
    "I",    # isort: organização de imports
    "N",    # pep8-naming
    "D",    # pydocstyle: docstrings
    "UP",   # pyupgrade: sintaxe moderna para a versão alvo
    "B",    # flake8-bugbear: bugs prováveis
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "DTZ",  # flake8-datetimez: datetimes sem timezone
    "T20",  # flake8-print: proíbe print()
    "BLE",  # flake8-blind-except
    "S",    # flake8-bandit: segurança
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PT",   # flake8-pytest-style
    "TID",  # flake8-tidy-imports: proíbe imports relativos (com a config abaixo)
    "RUF",  # regras específicas do Ruff
]
ignore = [
    "E501",  # comprimento de linha: o formatador controla; strings longas e URLs são toleradas
    "D105",  # docstring em métodos mágicos (__repr__, __eq__...) é dispensável
    "D107",  # a docstring de __init__ fica na docstring da classe
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # assert é a forma idiomática de verificar no pytest
    "S105",  # senhas fictícias em fixtures
    "S106",
    "D",     # docstrings não são exigidas em testes; o nome do teste descreve o cenário
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["f1"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ---------------------------------------------------------------- Tarefas (taskipy)
# Atalhos: poetry run task <nome>. Os comandos são os mesmos da CI.
[tool.taskipy.tasks]
docs = { cmd = "mkdocs serve", help = "documentação em http://127.0.0.1:8000, com recarga automática" }
docs-build = { cmd = "mkdocs build --strict", help = "build estrito da documentação (como na CI)" }

# ---------------------------------------------------------------- Pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "integration: testes que dependem de recursos reais (banco, storage, rede); executados em etapa própria",
]
xfail_strict = true

# ---------------------------------------------------------------- Coverage
[tool.coverage.run]
source = ["f1"]
branch = true

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.12,<0.13)",
    "mkdocs (>=1.6,<2.0)",
    "mkdocs-material (>=9.7.7,<10.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
