site_name: F1 — Pipeline OpenF1
site_description: Pipeline de dados históricos de Fórmula 1 a partir da API OpenF1, com carga em DuckDB.
docs_dir: docs

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/flag-checkered
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

nav:
  - Início: index.md
  - Primeiros passos: getting-started.md
  - Configuração: configuration.md
  - Arquitetura: architecture.md
  - Contratos de dados: data-contracts.md
  - Desenvolvimento: development.md
  - Testes e qualidade: testing.md
  - Operação: operations.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
