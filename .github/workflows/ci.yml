name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Um novo push no mesmo PR ou branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Mesma versão que gera o poetry.lock; compatível com requires-poetry.
  POETRY_VERSION: "2.5.1"

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Configurar Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "poetry"

      - name: Selecionar interpretador
        run: poetry env use "${{ steps.python.outputs.python-path }}"

      - name: Validar pyproject.toml e poetry.lock
        run: poetry check --lock

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check .

      - name: Testes unitários e cobertura
        run: >-
          poetry run pytest tests/unit
          --cov=f1
          --cov-report=term-missing
          --cov-fail-under=50

      # Na main, o build estrito acontece no job "documentacao", junto com o deploy.
      - name: Documentação
        if: github.event_name == 'pull_request'
        run: poetry run mkdocs build --strict

  integracao:
    # DuckDB em arquivo temporário e OpenF1 simulada; o teste contra a API real
    # só roda com F1_TESTES_REDE=1 e fica fora da CI.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Configurar Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "poetry"

      - name: Selecionar interpretador
        run: poetry env use "${{ steps.python.outputs.python-path }}"

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Testes de integração
        run: poetry run pytest tests/integration -m integration

  documentacao:
    # Publica a documentação no GitHub Pages (branch gh-pages) a cada push na main,
    # depois que qualidade e integração passaram.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [qualidade, integracao]
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Configurar Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "poetry"

      - name: Selecionar interpretador
        run: poetry env use "${{ steps.python.outputs.python-path }}"

      - name: Instalar dependências
        run: poetry install --no-interaction

      - name: Configurar autor dos commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy da documentação
        run: poetry run mkdocs gh-deploy --strict --force --no-history
